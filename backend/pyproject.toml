[project]
name = "smartquote-ai-backend"
version = "0.9.0"
description = "Backend for SmartQuote AI, an intelligent quotation automation platform."
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13.0",
    "celery[redis]>=5.6.0,<6.0.0",
    "fastapi>=0.115.0",
    "jinja2>=3.1.0,<4.0.0",
    "pdfplumber>=0.11.0,<1.0.0",
    "pydantic-settings>=2.6.0",
    "psycopg[binary]>=3.2.0",
    "pymupdf>=1.26.0,<2.0.0",
    "sqlalchemy>=2.0.0",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.3.0",
    "ruff>=0.7.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
per-file-ignores = {
    "app/application/use_cases/supplier_discovery_v2.py" = ["E501", "I001"],
    # Inherited quote-analysis debt from the Iteration 9/12 merge. These files are
    # intentionally not reformatted wholesale in Iteration 13 because that would
    # obscure the analysis-contract diff. New Iteration 13 modules remain fully linted.
    "app/application/use_cases/quotes.py" = ["E501", "F841", "SIM102"],
    "app/application/services/quote_document_validation.py" = ["E501"],
    "app/domain/quotes/entities.py" = ["E501", "F841"],
    "app/infrastructure/db/repositories/quote_repository.py" = ["E501"],
    "app/infrastructure/extraction/quote_document_extractor.py" = ["E501"],
}

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
