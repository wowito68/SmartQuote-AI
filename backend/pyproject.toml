[project]
name = "smartquote-ai-backend"
version = "0.5.0"
description = "Backend for SmartQuote AI, an intelligent quotation automation platform."
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13.0",
    "celery[redis]>=5.6.0,<6.0.0",
    "fastapi>=0.115.0",
    "jinja2>=3.1.0,<4.0.0",
    "pdfplumber>=0.11.0,<1.0.0",
    "pydantic-settings>=2.6.0",
    "psycopg[binary]>=3.2.0",
    "pymupdf>=1.26.0,<2.0.0",
    "sqlalchemy>=2.0.0",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.3.0",
    "ruff>=0.7.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
