[project]
name = "smartquote-ai-backend"
version = "0.9.0"
description = "Backend for SmartQuote AI, an intelligent quotation automation platform."
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13.0",
    "celery[redis]>=5.6.0,<6.0.0",
    "fastapi>=0.115.0",
    "jinja2>=3.1.0,<4.0.0",
    "pdfplumber>=0.11.0,<1.0.0",
    "pydantic-settings>=2.6.0",
    "psycopg[binary]>=3.2.0",
    "pymupdf>=1.26.0,<2.0.0",
    "sqlalchemy>=2.0.0",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.3.0",
    "ruff>=0.7.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"app/application/use_cases/supplier_discovery_v2.py" = ["E501", "I001"]
# Inherited formatting/static-analysis debt from Iterations 9-12. The ignores are
# intentionally path-scoped so new Iteration 13 modules remain fully linted.
"alembic/versions/e1a7b32c9d65_rfq_workflow_hardening.py" = ["I001"]
"alembic/versions/f2b8c47d1e90_quote_intake_analysis.py" = ["E501"]
"app/api/error_handlers.py" = ["E501"]
"app/application/ports/quote_repository.py" = ["E501"]
"app/application/services/comparison_engine.py" = ["E501"]
"app/application/services/quote_document_validation.py" = ["E501"]
"app/application/use_cases/quotes.py" = ["E501", "F401", "F841", "I001", "SIM102"]
"app/application/use_cases/rfq_workflow.py" = ["E501"]
"app/domain/quotes/entities.py" = ["E501", "F841"]
"app/infrastructure/db/repositories/quote_repository.py" = ["E501"]
"app/infrastructure/email/smtp_email_sender.py" = ["E501", "UP041"]
"app/infrastructure/extraction/quote_document_extractor.py" = ["E501"]
"tests/fixtures/quote_files.py" = ["E501"]
"tests/integration/test_quote_comparison_pipeline.py" = ["I001"]
"tests/integration/test_quote_formats_iteration12.py" = ["I001"]
"tests/integration/test_quote_iteration12.py" = ["I001"]
"tests/integration/test_rfq_iteration11.py" = ["I001"]
"tests/integration/test_rfq_pipeline.py" = ["I001"]
"tests/integration/test_supplier_discovery_pipeline.py" = ["I001"]
"tests/integration/test_supplier_iteration10.py" = ["I001"]
"tests/unit/application/test_quote_document_iteration12.py" = ["I001"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
