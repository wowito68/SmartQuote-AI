name: Export Iteration 8 Base

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  export:
    if: github.event.pull_request.head.ref == 'agent/iteration-8-rfq-email-delivery'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/iteration-8-rfq-email-delivery
      - name: Create source archive
        run: tar --exclude=.git --exclude=.github/workflows/export-iteration-8-base.yml -czf /tmp/smartquote-iteration-8-base.tar.gz .
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: smartquote-iteration-8-base
          path: /tmp/smartquote-iteration-8-base.tar.gz
          retention-days: 1
