name: Materialize Iteration 8

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write

jobs:
  materialize:
    if: >-
      github.event.pull_request.head.ref == 'agent/iteration-8-rfq-email-delivery' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/iteration-8-rfq-email-delivery
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: true
      - name: Reconstruct, verify and apply implementation
        run: |
          cat .iteration8/parts/part-* | base64 --decode > /tmp/iteration8.patch.gz
          echo 'e7297fb9479c64fb8aeae0ca9c2f3eadc11071075a0b282b9f3149f1cb4b2853  /tmp/iteration8.patch.gz' | sha256sum --check
          gzip -dc /tmp/iteration8.patch.gz > /tmp/iteration8.patch
          patch --batch --forward -p1 < /tmp/iteration8.patch
      - name: Update frozen dependency lock
        working-directory: backend
        run: uv lock
      - name: Commit implementation
        run: |
          rm -rf .iteration8
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- ':!.github/workflows'
          git commit -m 'Implement Iteration 8 RFQ email delivery'
          git push origin HEAD:agent/iteration-8-rfq-email-delivery
