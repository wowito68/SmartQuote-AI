name: Materialize Iteration 7

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write

jobs:
  materialize:
    if: >-
      github.event.pull_request.head.ref == 'agent/iteration-7-supplier-discovery' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/iteration-7-supplier-discovery
          fetch-depth: 0
      - name: Reconstruct and verify implementation
        run: |
          cat .iteration7/part* | base64 --decode > /tmp/iteration7.patch.gz
          echo 'b4160b1fca18f9be7c619e72910f35a190da2b7a925c53a8da2b0cb60d337072  /tmp/iteration7.patch.gz' | sha256sum --check --strict
          gzip --decompress --stdout /tmp/iteration7.patch.gz > /tmp/iteration7.patch
          patch --strip=1 < /tmp/iteration7.patch
          rm -rf .iteration7
          git checkout HEAD -- .github/workflows/iteration-3-ci.yml .github/workflows/export-iteration-7-base.yml
          python -m compileall -q backend/app backend/tests backend/alembic
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Implement Iteration 7 supplier discovery'
          git push origin HEAD:agent/iteration-7-supplier-discovery
