name: Fix Iteration 7 Ruff

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write

jobs:
  fix:
    if: >-
      github.event.pull_request.head.ref == 'agent/iteration-7-supplier-discovery' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/iteration-7-supplier-discovery
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: true
      - working-directory: backend
        run: uv sync --frozen
      - name: Apply remaining fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          matching = Path('backend/app/application/services/supplier_matching.py')
          lines = matching.read_text().splitlines()
          index = next(
              i for i, line in enumerate(lines)
              if line.strip() == 'if product_category and supplier.category:'
          )
          indent = lines[index][:-len(lines[index].lstrip())]
          lines[index:index + 3] = [
              f'{indent}if (',
              f'{indent}    product_category',
              f'{indent}    and supplier.category',
              f'{indent}    and product_category.casefold().strip()',
              f'{indent}    == supplier.category.casefold().strip()',
              f'{indent}):',
              f'{indent}    category_similarity = 1.0',
          ]
          matching.write_text('\n'.join(lines) + '\n')

          test_file = Path('backend/tests/integration/test_supplier_discovery_pipeline.py')
          lines = test_file.read_text().splitlines()
          index = next(
              i for i, line in enumerate(lines)
              if 'item for item in body["suppliers"]' in line
              and 'conductores.example.mx' in line
          )
          indent = lines[index][:-len(lines[index].lstrip())]
          lines[index:index + 1] = [
              f'{indent}item',
              f'{indent}for item in body["suppliers"]',
              f'{indent}if item["normalized_domain"] == "conductores.example.mx"',
          ]
          test_file.write_text('\n'.join(lines) + '\n')
          PY
          cd backend
          uv run ruff check .
          uv run python -m compileall app tests alembic
      - name: Commit remaining fixes
        run: |
          git checkout HEAD -- .github/workflows/fix-iteration-7-ruff.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend
          git commit -m 'Resolve remaining Ruff findings'
          git push origin HEAD:agent/iteration-7-supplier-discovery
