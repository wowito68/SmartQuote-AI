name: Materialize Iteration 6

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write

jobs:
  materialize:
    if: >-
      github.event.pull_request.head.ref == 'agent/iteration-6-ai-product-extraction' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/iteration-6-ai-product-extraction
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Reconstruct and verify implementation
        shell: bash
        run: |
          set -euo pipefail
          cat .iteration6/chunk-* | base64 --decode > /tmp/iteration6.tar.gz
          echo "a066d6941aec5ad90df76dae5a2f5f21f6495dc371ff584cc0c8c3ba030f2150  /tmp/iteration6.tar.gz" | sha256sum --check
          tar --extract --gzip --file /tmp/iteration6.tar.gz
          cd backend
          uv lock

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Materialize Iteration 6 implementation"
          git push origin HEAD:agent/iteration-6-ai-product-extraction
