name: Materialize Iteration 6

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write

jobs:
  materialize:
    if: >-
      github.event.pull_request.head.ref == 'agent/iteration-6-ai-product-extraction' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/iteration-6-ai-product-extraction
          fetch-depth: 0

      - name: Verify and extract implementation
        shell: bash
        run: |
          set -euo pipefail
          echo "06396402408a42827aae086622d46eb31ef93bfdaaba8581971c5185ad0d6e45  .iteration6/package.tar.gz" | sha256sum --check
          tar --extract --gzip --file .iteration6/package.tar.gz

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Materialize Iteration 6 implementation"
          git push origin HEAD:agent/iteration-6-ai-product-extraction
