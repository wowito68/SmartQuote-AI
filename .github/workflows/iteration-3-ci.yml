name: Iteration 6 diagnostics

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: smartquote
          POSTGRES_PASSWORD: smartquote
          POSTGRES_DB: smartquote
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U smartquote -d smartquote"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      SMARTQUOTE_DATABASE_URL: postgresql+psycopg://smartquote:smartquote@localhost:5432/smartquote
      SMARTQUOTE_STORAGE_ROOT: /tmp/smartquote-diagnostics-storage
      SMARTQUOTE_CELERY_BROKER_URL: redis://localhost:6379/0
      SMARTQUOTE_CELERY_RESULT_BACKEND: redis://localhost:6379/1
      SMARTQUOTE_CELERY_TASK_ALWAYS_EAGER: "false"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run alembic upgrade head
      - name: Capture Ruff
        shell: bash
        run: |
          set +e
          uv run ruff check . > /tmp/ruff.txt 2>&1
          echo $? > /tmp/ruff-exit.txt
          exit 0
      - name: Capture integration tests
        shell: bash
        run: |
          set +e
          uv run pytest tests/integration tests/test_health.py -q -vv > /tmp/integration.txt 2>&1
          echo $? > /tmp/integration-exit.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: iteration-6-diagnostics
          path: |
            /tmp/ruff.txt
            /tmp/ruff-exit.txt
            /tmp/integration.txt
            /tmp/integration-exit.txt
          if-no-files-found: error
          retention-days: 7
      - name: Enforce diagnostics
        shell: bash
        run: |
          test "$(cat /tmp/ruff-exit.txt)" = "0"
          test "$(cat /tmp/integration-exit.txt)" = "0"
