name: Iteration 3 CI

on:
  pull_request:
  push:
    branches:
      - agent/iteration-3-tender-management

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: smartquote
          POSTGRES_PASSWORD: smartquote
          POSTGRES_DB: smartquote
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smartquote -d smartquote"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SMARTQUOTE_DATABASE_URL: postgresql+psycopg://smartquote:smartquote@localhost:5432/smartquote
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Validate PostgreSQL migrations
        run: uv run alembic upgrade head

      - name: Run tests
        run: uv run pytest

      - name: Check coverage
        run: >-
          uv run --with coverage coverage run --source=app -m pytest -q &&
          uv run --with coverage coverage report --fail-under=90

      - name: Compile Python sources
        run: uv run python -m compileall app tests alembic

  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run Ruff
        id: ruff
        shell: bash
        run: |
          set +e
          uv run ruff check . --output-format=concise 2>&1 | tee ruff-output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload Ruff report
        uses: actions/upload-artifact@v4
        with:
          name: ruff-report
          path: backend/ruff-output.txt

      - name: Enforce Ruff result
        run: test "${{ steps.ruff.outputs.exit_code }}" = "0"
