name: Iteration 15 MVP completion

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-mvp:
    name: Backend MVP quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: smartquote
          POSTGRES_PASSWORD: smartquote
          POSTGRES_DB: smartquote
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U smartquote -d smartquote"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      SMARTQUOTE_DATABASE_URL: postgresql+psycopg://smartquote:smartquote@localhost:5432/smartquote
      SMARTQUOTE_STORAGE_ROOT: /tmp/smartquote-iteration15-storage
      SMARTQUOTE_CELERY_BROKER_URL: redis://localhost:6379/0
      SMARTQUOTE_CELERY_RESULT_BACKEND: redis://localhost:6379/1
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - name: Ruff
        run: uv run ruff check . --output-format=github
      - name: Apply migrations
        run: uv run alembic upgrade head
      - name: Full suite with coverage
        run: uv run --with coverage coverage run --source=app -m pytest -q
      - name: Coverage detail
        run: |
          uv run --with coverage coverage report -m
          uv run --with coverage coverage json -o coverage.json
      - name: Enforce 90 percent coverage
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("coverage.json").read_text())
          percent = float(payload["totals"]["percent_covered"])
          print(f"Total coverage: {percent:.2f}%")
          if percent < 90:
              raise SystemExit(
                  f"Coverage {percent:.2f}% is below the required 90.00%"
              )
          PY

  frontend-mvp:
    name: Frontend MVP build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
